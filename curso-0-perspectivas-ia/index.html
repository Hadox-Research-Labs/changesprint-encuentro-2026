<body>
  <nav class="narration-controls" aria-label="Controles de presentación">
    <a class="home-link" href="../" aria-label="Volver al índice">Índice</a>

  <main class="reveal" aria-label="Presentación Curso 00">
    <div class="slides" data-slides-container></div>
